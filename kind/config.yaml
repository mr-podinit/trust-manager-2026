kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-1.37

nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraMounts:
      - containerPath: /etc/containerd/certs.d/
        hostPath: ./registries/

  - role: worker
    image: kindest/node:v1.37.0-mount-options
    extraMounts:
      - containerPath: /etc/containerd/certs.d/
        hostPath: ./registries/


networking: {}