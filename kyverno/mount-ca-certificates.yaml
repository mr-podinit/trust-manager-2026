---
# MutatingPolicy per mount JKS (ConfigMap my-ca, key cacerts)
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: trust-manager-mount-jks
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: exclude-existing-ca-volume
      expression: >-
        !has(object.spec.volumes) || !object.spec.volumes.exists(v, v.name == 'ca-bundle-jks')
    - name: mount-ca-volume
      expression: >-
        has(object.metadata.annotations) && 'trust-manager.io/mount-jks' in object.metadata.annotations
  variables:
    - name: mountpoint
      expression: "object.metadata.annotations['trust-manager.io/mount-jks']"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "ca-bundle-jks",
                  configMap: Object.spec.volumes.configMap{
                    name: "my-ca"
                  }
                }
              ],
              containers: object.spec.containers.map(c,
                Object.spec.containers{
                  name: c.name,
                  volumeMounts: [
                    Object.spec.containers.volumeMounts{
                      name: "ca-bundle-jks",
                      mountPath: variables.mountpoint,
                      subPath: "cacerts",
                      readOnly: true
                    }
                  ]
                }
              )
            }
          }
---
